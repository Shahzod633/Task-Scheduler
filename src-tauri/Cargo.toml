[package]
name = "app"
version = "1.0.0"
description = "TaskFlow — локальный канбан-планировщик"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Native save/open dialogs for board export and import. Only the path picking
# happens here — the file itself is written by our own commands.
tauri-plugin-dialog = "2"
# Toast notifications from the Windows notification centre, for deadline
# reminders. Nothing leaves the machine: the plugin talks to the OS shell.
tauri-plugin-notification = "2"
# SQLCipher вместо обычного SQLite: база шифруется целиком, ключ — в
# Диспетчере учётных данных Windows (см. `crypto.rs`).
#
# Вариант с «vendored-openssl» собирает OpenSSL из исходников прямо в бинарник:
# в системе нет ни OpenSSL под MSVC, ни vcpkg, а тянуть внешнюю установку в
# зависимости локального приложения значит сломать его при первом переезде.
# Требует полноценного Perl (Strawberry Perl) — у perl из Git Bash вырезано
# семейство Locale::Maketext, и конфигуратор OpenSSL на нём не стартует.
#
# "backup" больше не нужен: копии пишутся через VACUUM INTO, потому что
# онлайн-API открывает файл-приёмник без ключа.
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
# Ключ шифрования лежит в Диспетчере учётных данных Windows, а не в файле рядом
# с базой: ключ в соседнем файле — это замок с ключом в скважине.
keyring = { version = "3", features = ["windows-native"] }
# Ключ генерируется из системного источника случайности, а не из времени.
getrandom = "0.2"
thiserror = "1.0"
# Downscaling and re-encoding the sidebar background picture. Default features
# pull in a decoder for every format the crate knows; only the three the file
# picker offers are enabled, which keeps the build and the binary smaller.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Already in the dependency tree via Tauri; declared here because we use it
# directly to hand the picture to the WebView as a `data:` URL.
base64 = "0.22"
# Письма-напоминания за неделю до срока — единственное место, откуда
# приложение выходит в сеть, и делает это только когда человек сам включил
# отправку и сам вписал сервер.
#
# Взяты три функции из семи: сборка письма, синхронный SMTP и TLS. Остальные
# — асинхронные транспорты — тянут за собой tokio, который приложению не нужен:
# письма уходят из того же фонового потока, что и проверка сроков.
# `native-tls` на Windows — это schannel, системный TLS: ни второго OpenSSL в
# бинарнике, ни своего набора корневых сертификатов, который пришлось бы
# обновлять руками.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
