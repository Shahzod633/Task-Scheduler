[package]
name = "app"
version = "1.0.0"
description = "TaskFlow — локальный канбан-планировщик"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Native save/open dialogs for board export and import. Only the path picking
# happens here — the file itself is written by our own commands.
tauri-plugin-dialog = "2"
# "backup" enables SQLite's online backup API, used for automatic backups.
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
thiserror = "1.0"
